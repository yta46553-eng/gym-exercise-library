
name: Build Gym Exercise Library APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Gym_Exercise_Library_Android_Cloud_Build.zip -d extracted
          find extracted -type f -name "settings.gradle*" -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f -name 'settings.gradle*' | head -n 1)")"
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Exercise-Library-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
